name: ci
on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: install pytest
        run: pip install pytest
      - name: configure + build (python binding pinned to CI python, jdk autodetected)
        run: |
          cmake -S . -B build -DPython3_EXECUTABLE=$(which python3)
          cmake --build build
      - name: ctest (c core, c++ binding, jvm binding)
        run: ctest --test-dir build --output-on-failure
      - name: python binding tests
        run: python3 -m pytest tests/python -q

  sanitize:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: configure with asan + ubsan
        run: |
          cmake -S . -B build \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
      - name: ctest (native suites under sanitizers)
        run: ctest --test-dir build --output-on-failure -R "core|cpp"

  package-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: install rpm build tools
        run: dnf -y install git rpm-build cmake gcc-c++ make
      - uses: actions/checkout@v4
      - name: trust the runner-owned checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build source tarball
        run: |
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          git archive --prefix=libmempressure-${version}/ -o libmempressure-${version}.tar.gz HEAD
          mkdir -p rpmbuild/SOURCES
          cp libmempressure-${version}.tar.gz rpmbuild/SOURCES/
      - name: rpmbuild
        run: rpmbuild -bb --define "_topdir $PWD/rpmbuild" packaging/rpm/libmempressure.spec
      - name: inspect packages
        run: |
          ls rpmbuild/RPMS/*/
          rpm -qlp rpmbuild/RPMS/*/libmempressure-0.1.0-*.rpm
          rpm -qlp rpmbuild/RPMS/*/libmempressure-devel-0.1.0-*.rpm

  package-deb:
    runs-on: ubuntu-latest
    container: debian:latest
    steps:
      - name: install deb build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake debhelper pkg-config
      - name: checkout with the container's own git
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - name: dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b
      - name: inspect packages
        run: |
          ls -1 ../libmempressure*deb
          dpkg-deb -c ../libmempressure0_*.deb
          dpkg-deb -c ../libmempressure-dev_*.deb

  python-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build sdist
        run: |
          pip install build twine
          python -m build --sdist
          twine check dist/*
      - name: install from the sdist and smoke it
        run: |
          pip install dist/*.tar.gz
          python -c "import mempressure as mp; mp.start(); print('ok', mp.__version__); mp.stop()"
